body{

.notice-box{

}

  gap:8px;
  color:#a878f2;
  font-size:18px;

}
.notice-title::before{

.notice-text{

  font-size:14px;
  line-height:1.7;
}

.btn-group{

  gap:14px;
}

.menu-btn{

  background:#7c44d9;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:16px;
  font-size:16px;
  cursor:pointer;
  transition:0.24s;
  box-shadow: 0 0 16px rgba(124,68,217,0.3);
}
.menu-btn:hover{

  box-shadow: 0 0 26px rgba(124,68,217,0.55);

.footer-text{
