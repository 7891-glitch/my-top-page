    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #000;
            background-image: 
                linear-gradient(rgba(212, 175, 55, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.06) 1px, transparent 1px);
            background-size: 35px 35px;
            min-height: 100vh;
            padding: 50px 20px;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
        }

        .main-title {
            color: #d4af37;
            text-align: center;
            font-size: 32px;
            margin-bottom: 35px;
            text-shadow: 0 0 15px #d4af37, 0 0 30px #d4af3760;
            letter-spacing: 3px;
        }

        .notice-box {
            background-color: #0a0a0a;
            border: 1px solid #d4af3740;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 35px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
        }

        .notice-title {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notice-text {
            color: #c2c2c2;
            font-size: 14px;
            line-height: 1.8;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 60px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* 按钮悬停发光效果 */
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::after {
            left: 150%;
        }

        .btn1 {
            background: linear-gradient(90deg, #b8860b, #d4af37);
        }

        .btn2 {
            background: linear-gradient(90deg, #d4af37, #b8860b);
        }

        .btn3 {
            background: #c29b30;
        }

        .btn4 {
            background: #947220;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 22px rgba(212, 175, 55, 0.5);
        }

        .footer-text {
            color: #d4af37;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #d4af37;
        }
    </style>
